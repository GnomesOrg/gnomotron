name: Deploy

on:
  push:
    branches:
      - denzel

jobs:
  build-push:
    name: build and push docker image
    runs-on: ubuntu-22.04
    permissions:     
     packages: write

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: set lower case owner name
        env:
          OWNER: '${{ github.repository_owner }}'
        run: |
          export "OWNER_LC=${OWNER,,}"
          export "IMAGE_NAME=ghcr.io/${OWNER_LC}/gnomotron"
          export "IMAGE_TAG=${{ github.sha }}"
          echo "OWNER_LC=${OWNER_LC}" >>${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME}" >>${GITHUB_ENV}
          echo "IMAGE_TAG=${IMAGE_TAG}" >>${GITHUB_ENV}

      - uses: docker/login-action@v1
        name: login to ghcr
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push the image
        run: |
          docker compose build
          docker compose push

  deploy:
    name: deploy via helm
    runs-on: denzel-runner
    needs:
      - build-push

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: set lower case owner name
        env:
          OWNER: '${{ github.repository_owner }}'
        run: |
          export "OWNER_LC=${OWNER,,}"
          export "IMAGE_NAME=ghcr.io/${OWNER_LC}/gnomotron"
          export "IMAGE_TAG=${{ github.sha }}"
          echo "OWNER_LC=${OWNER_LC}" >>${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME}" >>${GITHUB_ENV}
          echo "IMAGE_TAG=${IMAGE_TAG}" >>${GITHUB_ENV}

      - name: deploy helm chart
        run: |
          helm upgrade --install gnomotron ./helm \
            --set image.repository=ghcr.io/${{ env.OWNER_LC }}/gnomotron \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set-string secrets.GNOMOTRON_TELEGRAM_TOKEN=${{ secrets.GNOMOTRON_TELEGRAM_TOKEN }} \
            --set-string secrets.GPT_API_KEY=${{ secrets.GPT_API_KEY }} \
            --set-string secrets.GNOMOTRON_MONGO_URI=${{ secrets.GNOMOTRON_MONGO_URI }} \
            --set-string secrets.GNOMOTRON_MONGO_DB=${{ secrets.GNOMOTRON_MONGO_DB }} \
            --set-string secrets.MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }} \
            --set-string secrets.MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }} \
            --set-string secrets.MONGO_INITDB_DATABASE=${{ secrets.MONGO_INITDB_DATABASE }} \
            --set-string secrets.BOT_NAME=${{ secrets.BOT_NAME }} \
            --set-string secrets.STT_URI=${{ vars.STT_URI }} \
            --set-string secrets.STT_MODEL=${{ vars.STT_MODEL }}

          echo "✅ Deployed gnomotron: ghcr.io/${{ env.OWNER_LC }}/gnomotron:${{ env.IMAGE_TAG }}"
